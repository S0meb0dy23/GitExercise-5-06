<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pet Tracker</title>
  <link rel="stylesheet" href="nearby.css" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.7.1/dist/leaflet.css" />
</head>
<body>
  <h1>Pet Stores, Vets & Clinics in Malaysia</h1>

  <div class="search-bar">
    <input type="text" id="searchBox" placeholder="Search for pet stores or clinics..." />
    <select id="typeFilter">
      <option value="all">All</option>
      <option value="Pet Store">Pet Store</option>
      <option value="Veterinary Clinic">Veterinary Clinic</option>
    </select>
    <button onclick="searchLocations()">Search</button>
  </div>

  <div id="map"></div>

  <button onclick="toggleDarkMode()" class="dark-mode-btn">🌙</button>
  <button onclick="showFavorites()" class="favorites-btn">⭐ Favorites</button>

  <script src="https://unpkg.com/leaflet@1.7.1/dist/leaflet.js"></script>
  <script src="main.js"></script>
</body>
</html>
