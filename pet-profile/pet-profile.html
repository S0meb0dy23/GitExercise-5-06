<!DOCTYPE html>
<html lang="en">
<head>
  <title>Pawpulse - Pet Profile</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <link rel="stylesheet" href="pet-profile.css" />
  <link rel="stylesheet" href="/navbar.css">
</head>
<body class="bg-gray-50 font-sans">
  <div id="navbar-container"></div>
  <script src="/load-navbar.js"></script>
  <main class="container mx-auto px-4 py-8">
    <div class="flex flex-col md:flex-row gap-8">
      <!-- Profile Card -->
      <div class="w-full md:w-1/3 bg-white rounded-xl shadow-md p-6">
        <div class="relative w-32 h-32 mx-auto mb-4">
          <img id="pet-avatar" src="https://placekitten.com/200/200" alt="  " class="w-full h-full rounded-full object-cover">
          <input type="file" id="pet-avatar-input" class="hidden" accept="image/*">
          <button id="change-avatar-btn" class="absolute -bottom-2 -right-2 bg-indigo-600 text-white p-2 rounded-full shadow-md">
            <i class="fas fa-camera"></i>
          </button>
        </div>
        <div class="text-center">
          <h2 id="pet-name" class="text-xl font-bold"></h2>
          <p id="pet-breed" class="text-gray-600"></p>
          <p id="pet-age" class="text-sm text-gray-600"></p>
          <p id="pet-weight" class="text-sm text-gray-600"></p>
        </div>
        <button id="edit-profile-btn" class="mt-4 w-full bg-indigo-600 text-white py-2 rounded-lg hover:bg-indigo-700">Edit Profile</button>
      </div>

      <!-- Edit Form -->
      <div id="pet-form" class="w-full md:w-2/3 bg-white rounded-xl shadow-md p-6 hidden">
        <h2 class="text-xl font-bold mb-4">Edit Pet Profile</h2>
        <form id="pet-profile-form">
          <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <input id="name" type="text" placeholder="Pet Name" class="border p-2 rounded" value=""/>
            <input id="breed" type="text" placeholder="Breed" class="border p-2 rounded" value=""/>
            <input id="age" type="number" placeholder="Age" class="border p-2 rounded" value="Age"/>
            <input id="weight" type="number" placeholder="Weight" class="border p-2 rounded" value="Weight(kg)"/>
          </div>
          <div class="flex justify-end mt-4 space-x-2">
            <button id="cancel-edit-btn" type="button" class="border px-4 py-2 rounded">Cancel</button>
            <button type="submit" class="bg-indigo-600 text-white px-4 py-2 rounded hover:bg-indigo-700">Save</button>
          </div>
        </form>
      </div>

      <!-- Gallery -->
      <div id="pet-gallery" class="w-full md:w-2/3">
        <div class="bg-white p-6 rounded-xl shadow-md">
          <div class="flex justify-between items-center mb-4">
            <h2 class="text-xl font-bold">Photo Gallery</h2>
            <div>
              <input type="file" id="gallery-photo-input" class="hidden" accept="image/*">
              <button id="add-photo-btn" class="text-indigo-600 hover:text-indigo-800"><i class="fas fa-plus mr-1"></i> Add Photo</button>
            </div>
          </div>
          <div id="gallery-grid" class="grid grid-cols-2 md:grid-cols-3 gap-4">
            <!-- Photos added dynamically here -->
          </div>
        </div>
      </div>
    </div>
  </main>

  <script src="pet-profile.js"></script>

</body>
</html>
