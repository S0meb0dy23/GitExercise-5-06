<!DOCTYPE html>
<html lang="en">
<head>
  <title>Pawpulse - Pet Profile</title>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <link rel="stylesheet" href="pet-profile.css" />
  <script src="pet-profile.js" defer></script>
  <link rel="stylesheet" href="/navbar.css">
</head>
<body class="bg-gray-50 font-sans">
  <div id="navbar-container"></div>
  <script src="/load-navbar.js"></script>
  
  <div id="auth-alert" class="fixed inset-0 bg-gray-900 bg-opacity-50 flex items-center justify-center hidden z-50">
    <div class="bg-white p-6 rounded-lg shadow-xl max-w-md w-full">
      <h3 class="text-xl font-bold mb-4">Session Expired</h3>
      <p class="mb-4">Your session has expired. Please log in again.</p>
      <button id="go-to-login" class="w-full bg-indigo-600 text-white py-2 rounded hover:bg-indigo-700">
        Go to Login
      </button>
    </div>
  </div>

  <main class="container mx-auto px-4 py-8">
    <div class="flex justify-between items-center mb-6">
      <h1 class="text-2xl font-bold">My Pets</h1>
      <div class="flex space-x-2">
        <button id="logout-btn" class="text-gray-600 hover:text-gray-900">
          <i class="fas fa-sign-out-alt mr-1"></i> Logout
        </button>
      </div>
    </div>
    
    <div class="flex flex-col md:flex-row gap-8">
      <div class="w-full md:w-1/3 bg-white rounded-xl shadow-md p-6">
        <div class="relative w-32 h-32 mx-auto mb-4">
          <img id="pet-avatar" alt="Pet Avatar" class="w-full h-full rounded-full object-cover">
          
          <div class="absolute top-0 right-0">
            <button id="pet-switcher-btn">
              <i class="fas fa-ellipsis-v"></i>
            </button>
            <div id="pet-switcher-menu" class="absolute right-0 mt-2 w-48 bg-white rounded-md shadow-lg z-10 hidden">
              <div class="py-1"></div>
              <div class="border-t border-gray-100">
                <button id="add-new-pet-btn" class="block w-full text-left px-4 py-2 text-sm text-gray-700 hover:bg-gray-100">
                  <i class="fas fa-plus mr-2"></i> Add New Pet
                </button>
              </div>
            </div>
          </div>
        </div>
        <div class="text-center">
          <h2 id="pet-name" class="text-xl font-bold"></h2>
          <p id="pet-breed" class="text-gray-600"></p>
          <p id="pet-age" class="text-sm text-gray-600"></p>
          <p id="pet-weight" class="text-sm text-gray-600"></p>
        </div>
        <button id="edit-profile-btn" class="mt-4 w-full bg-indigo-600 text-white py-2 rounded-lg hover:bg-indigo-700">Edit Profile</button>
      </div>

      <div id="pet-form" class="w-full md:w-2/3 bg-white rounded-xl shadow-md p-6 hidden">
        <h2 class="text-xl font-bold mb-4">Edit Pet Profile</h2>
        <form id="pet-profile-form">
          <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <input id="name" type="text" placeholder="Pet Name" class="border p-2 rounded" required>
            <input id="breed" type="text" placeholder="Breed" class="border p-2 rounded">
            <input id="age" type="number" placeholder="Age" class="border p-2 rounded" min="0">
            <input id="weight" type="number" placeholder="Weight (kg)" class="border p-2 rounded" min="0" step="0.1">
          </div>
          <div class="flex justify-end mt-4 space-x-2">
            <button id="cancel-edit-btn" type="button" class="border px-4 py-2 rounded">Cancel</button>
            <button type="submit" class="bg-indigo-600 text-white px-4 py-2 rounded hover:bg-indigo-700">Save</button>
          </div>
        </form>
      </div>

      <div id="pet-gallery" class="w-full md:w-2/3">
        <div class="bg-white p-6 rounded-xl shadow-md">
          <div class="flex justify-between items-center mb-4">
            <h2 class="text-xl font-bold">Photo Gallery</h2>
            <div>
              <input type="file" id="gallery-photo-input" class="hidden" accept="image/*">
              <button id="add-photo-btn" class="text-indigo-600 hover:text-indigo-800"><i class="fas fa-plus mr-1"></i> Add Photo</button>
            </div>
          </div>
          <div id="gallery-grid" class="grid grid-cols-2 md:grid-cols-3 gap-4"></div>
        </div>
      </div>
    </div>
  </main>

  <script>
    document.getElementById('logout-btn').addEventListener('click', () => {
      fetch('/logout.php', {
        method: 'POST',
        credentials: 'same-origin'
      }).then(() => {
        window.location.href = '/login.html';
      });
    });

    document.getElementById('go-to-login').addEventListener('click', () => {
      window.location.href = '/login.html';
    });
  </script>
</body>
</html>
