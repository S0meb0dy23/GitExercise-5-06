<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Pet Tracker - Pet Shops & Vets Near Me</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
</head>
<body>
  <h1>Search for Pet Shops & Vets</h1>

  <div class="search-bar">
    <input type="text" id="locationInput" placeholder="Enter a location..." />
    <button onclick="searchLocation()">Search</button>
  </div>

  <div id="map"></div>

  <button onclick="showFavorites()" class="favorites-btn">⭐ Show Favorites</button>
  <button onclick="toggleDarkMode()" class="dark-mode-btn">🌙 Toggle Dark Mode</button>

  <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
  <script>
    let map;
    let marker;
    let petShops = [];
    let favoriteShops = JSON.parse(localStorage.getItem('favorites')) || [];
    
    function initMap() {
      map = L.map('map').setView([51.505, -0.09], 13); // Default location

      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
      }).addTo(map);
      
      // Get user location if possible
      if (navigator.geolocation) {
        navigator.geolocation.getCurrentPosition(position => {
          const { latitude, longitude } = position.coords;
          map.setView([latitude, longitude], 13);
          L.marker([latitude, longitude]).addTo(map)
            .bindPopup("You are here").openPopup();
        });
      }
    }

    function searchLocation() {
      const location = document.getElementById('locationInput').value;
      if (!location) return alert("Please enter a location.");

      fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${location}`)
        .then(response => response.json())
        .then(data => {
          if (data.length > 0) {
            const { lat, lon } = data[0];
            map.setView([lat, lon], 13);
            if (marker) map.removeLayer(marker);
            marker = L.marker([lat, lon]).addTo(map);
          } else {
            alert("Location not found.");
          }
        });
    }

    function showFavorites() {
      const favoriteList = favoriteShops.map(shop => `<li>${shop.name}</li>`).join('');
      alert(`Favorites:\n${favoriteList}`);
    }

    function toggleDarkMode() {
      const currentMode = localStorage.getItem('theme') || 'light';
      const newMode = currentMode === 'light' ? 'dark' : 'light';
      
      document.body.classList.toggle('dark-mode', newMode === 'dark');
      localStorage.setItem('theme', newMode);
    }

    document.addEventListener("DOMContentLoaded", () => {
      const savedTheme = localStorage.getItem('theme') || 'light';
      if (savedTheme === 'dark') {
        document.body.classList.add('dark-mode');
      }
      initMap();
    });

    // Save a pet shop to favorites
    function saveToFavorites(shop) {
      if (!favoriteShops.find(fav => fav.id === shop.id)) {
        favoriteShops.push(shop);
        localStorage.setItem('favorites', JSON.stringify(favoriteShops));
      }
    }
  </script>
</body>
</html>
<link rel="stylesheet" href="style.css">
