<head>
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
</head>

<nav class="navbar-wrapper">
  <div>
    <div>
      <a href="/pet-profile/pet-profile.html" class="tab-btn">
        <i class="fas fa-user"></i>Pet Profile
      </a>
      <a href="/Medical_info/medical.html" class="tab-btn">
        <i class="fas fa-heartbeat"></i>Medical Info
      </a>
      <a href="/Calendar/index.html" class="tab-btn">
        <i class="fas fa-bell"></i>Reminders
      </a>
      <a href="/petstorenearby/petstorenearby.html" class="tab-btn">
        <i class="fas fa-map-marker-alt"></i>Near Me
      </a>
      <a href="community.html" class="tab-btn">
        <i class="fas fa-users"></i>Community
      </a>
    </div>
  </div>
</nav>


<script>
  // Highlight current page in nav
  document.addEventListener('DOMContentLoaded', function () {
    const navLinks = document.querySelectorAll('.navbar-wrapper .tab-btn');
    const currentPage = window.location.pathname.split('/').pop() || 'index.html';

    navLinks.forEach(link => {
      const linkPage = link.getAttribute('href').split('/').pop();
      if (currentPage === linkPage) {
        link.classList.add('active');
      }
    });
  });
</script>
