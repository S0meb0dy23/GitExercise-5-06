<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pet Tracker</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.7.1/dist/leaflet.css" />
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: #f0f2f5;
      color: #333;
    }

    h1 {
      text-align: center;
      padding: 30px 15px;
      background: linear-gradient(to right, #4CAF50, #66bb6a);
      color: white;
      font-size: 28px;
      letter-spacing: 1px;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.2);
    }

    #map {
      height: 500px;
      width: 90%;
      max-width: 1000px;
      margin: 30px auto;
      border-radius: 16px;
      border: 1px solid #ccc;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.1);
    }

    button {
      display: block;
      margin: 20px auto;
      padding: 14px 30px;
      font-size: 16px;
      font-weight: bold;
      background: #4CAF50;
      color: white;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      transition: background 0.3s, transform 0.2s;
      box-shadow: 0 4px 10px rgba(76, 175, 80, 0.4);
    }

    button:hover {
      background: #43a047;
      transform: scale(1.03);
    }

    .dark-mode-toggle {
      position: absolute;
      top: 20px;
      right: 20px;
      background: #4CAF50;
      color: white;
      border: none;
      border-radius: 50%;
      padding: 10px;
      cursor: pointer;
      font-size: 18px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
    }

    .dark-mode-toggle:hover {
      background: #43a047;
    }

    .search-bar {
      display: flex;
      justify-content: center;
      align-items: center;
      margin: 20px auto;
      background: #fff;
      padding: 15px;
      border-radius: 12px;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
      width: fit-content;
    }

    .search-bar input {
      padding: 10px;
      font-size: 16px;
      border-radius: 5px;
      border: 1px solid #ddd;
      margin-right: 10px;
    }

    @media (max-width: 768px) {
      #map {
        height: 400px;
        width: 95%;
      }

      h1 {
        font-size: 22px;
        padding: 20px;
      }

      button {
        width: 80%;
        font-size: 14px;
      }
    }
  </style>
</head>
<body>

  <h1>Pet Stores, Vets & Clinics in Malaysia</h1>

  <div class="search-bar">
    <input type="text" id="searchBox" placeholder="Search for pet stores or clinics..." />
    <button onclick="searchLocations()">Search</button>
  </div>

  <div id="map"></div>

  <button onclick="toggleDarkMode()" class="dark-mode-toggle">🌙</button>

  <script src="https://unpkg.com/leaflet@1.7.1/dist/leaflet.js"></script>
  <script>
    const map = L.map('map').setView([4.2105, 101.9758], 6); // Center on Malaysia

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors',
    }).addTo(map);

    const petLocations = [
      { lat: 1.4626, lon: 103.7593, name: "Pet World Johor", type: "Pet Store" },
      { lat: 5.3281, lon: 103.1350, name: "Terengganu Pet Clinic", type: "Veterinary Clinic" },
      { lat: 3.0732, lon: 101.5163, name: "Selangor Pet Clinic", type: "Veterinary Clinic" },
      { lat: 3.1412, lon: 101.6869, name: "Kuala Lumpur Pet Clinic", type: "Veterinary Clinic" },
      { lat: 5.4112, lon: 100.3353, name: "Penang Pet Shop", type: "Pet Store" },
      { lat: 2.3141, lon: 102.220, name: "Muar Pet Store", type: "Pet Store" },
      { lat: 3.0369, lon: 101.6172, name: "Setia Alam Pet Shop", type: "Pet Store" },
      { lat: 3.1412, lon: 101.7116, name: "Pets' Garden", type: "Pet Store" },
      { lat: 3.0434, lon: 101.5084, name: "Pets' Wonderland Selangor", type: "Pet Store" },
      { lat: 1.4626, lon: 103.7605, name: "Johor Pet Care", type: "Pet Store" },
      { lat: 3.0130, lon: 101.6641, name: "Bukit Jalil Vet Clinic", type: "Veterinary Clinic" },
      { lat: 3.1578, lon: 101.7115, name: "Pet Care Clinic, KL", type: "Veterinary Clinic" },
      { lat: 2.3041, lon: 102.3520, name: "Johor Bahru Pet World", type: "Pet Store" },
      { lat: 3.0860, lon: 101.7124, name: "KL Pets", type: "Pet Store" },
      { lat: 3.1440, lon: 101.6845, name: "Selangor Animal Clinic", type: "Veterinary Clinic" },
      { lat: 5.3658, lon: 100.5973, name: "Penang Pet Clinic", type: "Veterinary Clinic" },
      { lat: 3.0872, lon: 101.6882, name: "Setia Alam Pet Shop", type: "Pet Store" },
      { lat: 2.3122, lon: 102.2281, name: "Muar Vet Care", type: "Veterinary Clinic" },
      { lat: 1.4709, lon: 103.7541, name: "PetVet Johor", type: "Veterinary Clinic" },
      { lat: 5.3590, lon: 100.3120, name: "Pet World Penang", type: "Pet Store" },
      { lat: 5.3391, lon: 100.3135, name: "Penang Vet Clinic", type: "Veterinary Clinic" },
      { lat: 1.4712, lon: 103.7350, name: "Johor Pet Shop", type: "Pet Store" },
      { lat: 2.2744, lon: 102.2381, name: "Melaka Pet World", type: "Pet Store" },
      { lat: 3.1650, lon: 101.7112, name: "Kuala Lumpur Pet Clinic 2", type: "Veterinary Clinic" },
      { lat: 3.1291, lon: 101.6931, name: "Pet Vet Selangor", type: "Veterinary Clinic" },
      { lat: 1.4876, lon: 103.7558, name: "Pet Care Clinic Johor", type: "Veterinary Clinic" },
      { lat: 5.4795, lon: 100.4201, name: "Pet Clinic Penang", type: "Veterinary Clinic" },
      { lat: 2.3850, lon: 102.2125, name: "Seremban Pet Shop", type: "Pet Store" },
    ];

    petLocations.forEach(location => {
      const marker = L.marker([location.lat, location.lon]).addTo(map);
      marker.bindPopup(`<b>${location.name}</b><br>${location.type}`).openPopup();
    });

    const bounds = petLocations.map(location => [location.lat, location.lon]);
    map.fitBounds(bounds);

    function toggleDarkMode() {
      document.body.classList.toggle("dark-mode");
      const isDarkMode = document.body.classList.contains("dark-mode");
      if (isDarkMode) {
        document.body.style.backgroundColor = "#121212";
        document.body.style.color = "#e0e0e0";
        document.querySelector("h1").style.backgroundColor = "#333";
      } else {
        document.body.style.backgroundColor = "#f0f2f5";
        document.body.style.color = "#333";
        document.querySelector("h1").style.backgroundColor = "#4CAF50";
      }
    }

    function searchLocations() {
      const query = document.getElementById('searchBox').value.toLowerCase();
      const filteredLocations = petLocations.filter(location => location.name.toLowerCase().includes(query));
      alert('Found ' + filteredLocations.length + ' results.');
    }
  </script>

</body>
</html>

<link rel="stylesheet" href="css/styles.css" />
